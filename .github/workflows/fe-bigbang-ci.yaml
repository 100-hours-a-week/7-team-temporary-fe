name: BigBang-FE-CI

on:
  pull_request:
    branches:
      - develop
      - main
      - 'release/**'
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

concurrency:
  group: fe-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fe:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.1 --activate

      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      - name: Lint (PR)
        run: pnpm run lint

      - name: Build (Next.js)
        run: pnpm run build

      - name: Notify success (develop PR)
        if: success() && github.base_ref == 'develop'
        run: |
          set -euo pipefail
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"✅ FE CI 성공 (develop PR)\\nRepo: ${{ github.repository }}\\nPR: #${{ github.event.pull_request.number }} (${{ github.head_ref }} -> ${{ github.base_ref }})\\nCommit: ${SHORT_SHA}\\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true

      - name: Notify failure
        if: failure()
        run: |
          set +e
          SHORT_SHA="$(echo "${GITHUB_SHA}" | cut -c1-7)"
          CONTEXT="PR #${{ github.event.pull_request.number }} (${{ github.head_ref }} -> ${{ github.base_ref }})"

          curl -X POST "${{ secrets.DISCORD_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{\"content\":\"🚨 FE CI 실패\\nRepo: ${{ github.repository }}\\n${CONTEXT}\\nCommit: ${SHORT_SHA}\\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" || true
