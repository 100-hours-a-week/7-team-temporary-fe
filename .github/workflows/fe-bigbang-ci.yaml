name: BigBang-FE-CI

on:
  pull_request:
    branches:
      - deprecated
  push:
    branches:
      - deprecated

jobs:
  fe:
    name: Frontend CI (Next.js)
    runs-on: ubuntu-latest

    # 공통
    steps:
      # 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # Node.js 설치 (LTS 권장)
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Corepack 활성화 / pnpm 설치
      - name: Enable Corepack (pnpm)
        run: |
          corepack enable
          corepack prepare pnpm@9.15.1 --activate

      # 의존성 설치
      - name: Install dependencies
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile

      # PR : develop/main/release(린트)
      - name: Lint (PR)
        if: github.event_name == 'pull_request'
        run: pnpm run lint

      # PR/Merge : develop/main/release(빌드)
      - name: Build (Next.js)
        run: pnpm run build

      # Merge : main/release(보안)
      - name: Security Audit (deps)
        if: >
          github.event_name == 'push' &&
          (
            github.ref == 'refs/heads/main' ||
            startsWith(github.ref, 'refs/heads/release/')
          )
        run: pnpm audit --audit-level=high

      # 디스코드 알림
      - name: Notify CI result (PR + push)
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            PREFIX="PR CI"
            CONTEXT="PR #${{ github.event.pull_request.number }} (${{ github.head_ref }} → ${{ github.base_ref }})"
          else
            PREFIX="CI"
            CONTEXT="Branch: ${{ github.ref_name }}"
          fi
          
          ACTOR="${{ github.actor }}"
          SHA="${{ github.sha }}"
          SHORT_SHA=$(echo "$SHA" | cut -c1-7)

          if [ "${{ job.status }}" = "success" ]; then
            STATUS="✅ ${PREFIX} 성공"
          else
            STATUS="🚨 ${PREFIX} 실패"
          fi

          curl -X POST ${{ secrets.DISCORD_WEBHOOK_URL }} \
            -H "Content-Type: application/json" \
            -d "{
              \"content\": \"$STATUS\nRepo: ${{ github.repository }}\n$CONTEXT\nActor: $ACTOR\nCommit: $SHORT_SHA\nRun: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" || true
